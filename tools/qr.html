<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Text Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        #qrcode {
            margin-top: 30px;
            text-align: center;
            display: none;
        }

        #qrcode canvas,
        #qrcode img {
            border: 10px solid #f0f0f0;
            border-radius: 10px;
            max-width: 100%;
        }

        #scanner {
            margin-top: 30px;
            display: none;
        }

        #reader {
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .output h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .output-text {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .info {
            margin-top: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 5px;
            font-size: 12px;
            color: #1976d2;
        }

        .hidden {
            display: none;
        }

        .download-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .download-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 QR Text Share</h1>
        <p class="subtitle">Share text via QR code - no backend required!</p>

        <div id="input-section">
            <textarea id="textInput" placeholder="Paste or type your text here..."></textarea>

            <div class="button-group">
                <button class="btn-primary" onclick="generateQR()">Generate QR Code</button>
                <button class="btn-secondary" onclick="showScanner()">Scan QR Code</button>
            </div>

            <div class="info">
                💡 QR codes can hold ~3KB of data. With compression, expect 5-10KB of text (1-2 pages).
            </div>
        </div>

        <div id="qrcode"></div>

        <div id="scanner">
            <h3>Scan QR Code</h3>
            <div id="reader"></div>
            <button class="btn-secondary" style="margin-top: 15px;" onclick="hideScanner()">Cancel</button>
        </div>

        <div class="output" id="output">
            <h3>📄 Decoded Text:</h3>
            <div class="output-text" id="outputText"></div>
            <button class="btn-secondary" style="margin-top: 15px;" onclick="reset()">Create New</button>
        </div>
    </div>

    <!-- LZ-String compression library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <!-- QR Code generation library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- QR Code scanning library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <script>
        let html5QrCode = null;
        let currentQRCode = null;

        function generateQR() {
            const text = document.getElementById('textInput').value.trim();

            if (!text) {
                alert('Please enter some text first!');
                return;
            }

            // Compress the text
            const compressed = LZString.compressToBase64(text);

            // Check size (QR codes have limits)
            const dataUrl = `data:text/plain,${compressed}`;
            if (dataUrl.length > 4000) {
                alert('⚠️ Text is too large for QR code! Try shorter text or use the Cloudflare version.');
                return;
            }

            // Clear previous QR code
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrContainer.style.display = 'block';

            // Generate QR code
            currentQRCode = new QRCode(qrContainer, {
                text: compressed,
                width: 300,
                height: 300,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // Add download button
            setTimeout(() => {
                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'download-btn';
                downloadBtn.textContent = '💾 Download QR Code';
                downloadBtn.onclick = downloadQR;
                qrContainer.appendChild(downloadBtn);
            }, 100);

            // Show success message
            const info = document.createElement('div');
            info.className = 'info';
            info.style.marginTop = '15px';
            info.textContent = `✅ QR generated! Original: ${text.length} bytes, Compressed: ${compressed.length} bytes`;
            qrContainer.appendChild(info);
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            if (canvas) {
                const url = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'qr-text-share.png';
                link.href = url;
                link.click();
            }
        }

        function showScanner() {
            document.getElementById('input-section').style.display = 'none';
            document.getElementById('qrcode').style.display = 'none';
            document.getElementById('scanner').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess,
                onScanError
            ).catch(err => {
                console.error('Camera error:', err);
                alert('Could not access camera. Please check permissions.');
                hideScanner();
            });
        }

        function hideScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    document.getElementById('scanner').style.display = 'none';
                    document.getElementById('input-section').style.display = 'block';
                }).catch(err => console.error('Error stopping scanner:', err));
            }
        }

        function onScanSuccess(decodedText) {
            console.log('QR decoded:', decodedText);

            // Stop scanner
            hideScanner();

            try {
                // Decompress the text
                const decompressed = LZString.decompressFromBase64(decodedText);

                if (!decompressed) {
                    throw new Error('Failed to decompress');
                }

                // Show output
                document.getElementById('outputText').textContent = decompressed;
                document.getElementById('output').style.display = 'block';
                document.getElementById('input-section').style.display = 'none';
            } catch (error) {
                console.error('Decompression error:', error);
                alert('⚠️ Could not decode QR code. It might not be generated by this app.');
                document.getElementById('input-section').style.display = 'block';
            }
        }

        function onScanError(errorMessage) {
            // Ignore scan errors (happens continuously while scanning)
        }

        function reset() {
            document.getElementById('textInput').value = '';
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qrcode').style.display = 'none';
            document.getElementById('output').style.display = 'none';
            document.getElementById('input-section').style.display = 'block';
            currentQRCode = null;
        }

        // Check if QR data is in URL (for future enhancement)
        window.addEventListener('load', () => {
            const hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    const decompressed = LZString.decompressFromBase64(decodeURIComponent(hash));
                    if (decompressed) {
                        document.getElementById('outputText').textContent = decompressed;
                        document.getElementById('output').style.display = 'block';
                        document.getElementById('input-section').style.display = 'none';
                    }
                } catch (e) {
                    console.log('No valid data in URL');
                }
            }
        });
    </script>
</body>
</html>
